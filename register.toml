[[service]]
name = "headscale"
purpose = "Self-hosted Tailscale control server that lets Drake's machines join one private network."
unit = "headscale"
category = "network"
owner = "drake"
port = 443
files = ["/etc/headscale/config.yaml", "/var/lib/headscale/"]
secrets = "/var/lib/headscale/noise_private.key"
health = "curl -fs http://127.0.0.1:9090/metrics -o /dev/null"
boot = true
notes = "Health uses the local metrics port because https://127.0.0.1/health fails TLS (certificate is for hs.aienos.com)."

[[service]]
name = "headscale-backup"
purpose = "Nightly timer that backs up the Headscale database and pushes it off the machine."
unit = "headscale-backup.timer"
category = "storage"
owner = "drake"
depends_on = ["headscale"]
files = ["/usr/local/bin/headscale-backup.sh"]
boot = true

[[service]]
name = "gandi-ddns"
purpose = "Timer that keeps the hs.aienos.com DNS record pointing at this machine's current address."
unit = "gandi-ddns.timer"
category = "network"
owner = "drake"
files = ["/usr/local/bin/gandi-ddns.sh"]
secrets = "/etc/gandi-pat"
boot = true

[[service]]
name = "fail2ban"
purpose = "Bans addresses that repeatedly fail to log in (SSH jail)."
unit = "fail2ban"
category = "security"
owner = "drake"
files = ["/etc/fail2ban/jail.local"]
health = "sudo fail2ban-client status >/dev/null"
boot = true
notes = "Config restored from the old Pi backup; only the sshd jail is active."

[[service]]
name = "psad"
purpose = "Watches firewall logs for port scans and flags the scanner."
unit = "psad"
category = "security"
owner = "drake"
files = ["/etc/psad/psad.conf"]
boot = true
notes = "Config restored from backup. Needs firewall logging rules to see anything; none were added."

[[service]]
name = "pihole"
purpose = "Pi-hole: the home network DNS server that blocks ad and tracker domains."
unit = "pihole-FTL"
category = "network"
owner = "drake"
port = 53
files = ["/etc/pihole/pihole.toml","/etc/pihole/gravity.db"]
secrets = "/etc/pihole/pihole.toml"
health = "dig +short +time=2 @127.0.0.1 example.com | grep -q ."
boot = true
notes = "Fresh install of v6, then pihole.toml, block lists and adlists restored. Old query history (790 MB) NOT copied. The router is NOT pointed at this Pi; DHCP is off. Ubuntu stub resolver stays on 127.0.0.53."

[[service]]
name = "vault"
purpose = "HashiCorp Vault: the locked store for Drake's secrets."
unit = "vault"
category = "secrets"
owner = "drake"
port = 8200
files = ["/etc/vault.d/vault.hcl","/opt/vault","/usr/bin/vault"]
secrets = "/opt/vault/data"
health = "ss -ltn | grep -q 127.0.0.1:8200"
boot = true
notes = "Copied as opaque files and started SEALED. Nobody unsealed or read it (Drake privacy rule)."

[[service]]
name = "vault-unseal"
purpose = "Helper that unseals Vault automatically after it starts."
unit = "vault-unseal"
category = "secrets"
owner = "drake"
depends_on = ["vault"]
files = ["/usr/local/sbin/vault-local-unseal"]
secrets = "/usr/local/sbin/vault-local-unseal"
boot = false
notes = "Installed but NOT enabled or started on purpose: starting it would unlock the vault. Drake must decide."

[[service]]
name = "docker"
purpose = "Container engine that runs Forgejo."
unit = "docker"
category = "infra"
owner = "drake"
files = ["/opt/atlas-forgejo/docker-compose.yml"]
health = "sudo docker info >/dev/null 2>&1"
boot = true
notes = "Installed from Ubuntu (docker.io)."

[[service]]
name = "atlas-forgejo"
purpose = "Atlas Forge: Drake's private Git server (Forgejo) holding the Atlas repositories."
unit = "docker"
category = "git"
owner = "drake"
port = 3010
depends_on = ["docker"]
files = ["/opt/atlas-forgejo/docker-compose.yml","/srv/atlas/forgejo"]
secrets = "/srv/atlas/forgejo/jwt/private.pem"
health = "curl -fs http://127.0.0.1:3010/ -o /dev/null"
boot = true
notes = "Container, not a unit; restart policy keeps it up. Data restored from /srv/atlas/forgejo. The pinned image version was gone from the registry, so compose now uses code.forgejo.org/forgejo/forgejo:16-rootless (same major version; original compose saved as docker-compose.yml.orig-pinned). Data owner is uid 1000 (drake) because the container runs as 1000."

[[service]]
name = "atlas-forgejo-backup"
purpose = "Nightly 03:17 job that makes an encrypted Forgejo recovery archive and uploads it."
unit = "atlas-forgejo-backup.timer"
category = "storage"
owner = "drake"
depends_on = ["atlas-forgejo","docker"]
files = ["/usr/local/libexec/atlas-forgejo-backup","/etc/atlas-recovery-vault/backup.env","/srv/atlas/backups/forgejo"]
secrets = "/etc/atlas-recovery-vault/backup.env"
boot = true
notes = "Timer installed and active. Not yet run here, so the upload is UNVERIFIED."

