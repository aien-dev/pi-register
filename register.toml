# Generic Debian/Ubuntu example, not a deployment inventory.
# Copy to register.local.toml and adapt it to your machine.
# Use: pi-register --register register.local.toml <command>
# Read-only preview: pi-register --register register.toml doc

[[service]]
name = "ssh"
purpose = "Allow authenticated remote administration"
unit = "ssh"
category = "administration"
owner = "system administrator"
port = 22
files = ["/etc/ssh/sshd_config"]
boot = true
notes = "Example for a host with openssh-server installed. Confirm the unit name and desired boot policy before using control commands."
